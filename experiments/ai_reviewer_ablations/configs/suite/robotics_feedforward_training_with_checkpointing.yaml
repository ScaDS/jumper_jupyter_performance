# One robotics payload against the four presets of the cell_77 pilot.
#
#   sbatch --array=0-3 scripts/capella.sbatch suite=robotics_feedforward_training_with_checkpointing protocol=pilot
#
# Tiny GPU steps with per-step host syncs and checkpoint I/O.
#
# A suite per payload rather than one for the family, so that each gets its
# own run, its own allocation and its own cost; robotics.yaml keeps the full
# nine-preset grid for the main run.
id: robotics_feedforward_training_with_checkpointing
description: robotics/feedforward_training_with_checkpointing against the four most informative presets.
usecases:
  - robotics/feedforward_training_with_checkpointing
ablations:
  - base
  - code_only
  - no_timing
  - no_perf
