# One robotics payload against the four presets of the cell_77 pilot.
#
#   sbatch --array=0-3 scripts/capella.sbatch suite=robotics_vae_model_training protocol=pilot
#
# GPU training fed by a single-process DataLoader.
#
# A suite per payload rather than one for the family, so that each gets its
# own run, its own allocation and its own cost; robotics.yaml keeps the full
# nine-preset grid for the main run.
id: robotics_vae_model_training
description: robotics/vae_model_training against the four most informative presets.
usecases:
  - robotics/vae_model_training
ablations:
  - base
  - code_only
  - no_timing
  - no_perf
