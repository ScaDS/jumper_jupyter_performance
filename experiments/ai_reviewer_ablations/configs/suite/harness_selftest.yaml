# Not a measurement: the smallest thing that proves the wiring works, end to
# end, against a payload with no dataset and no dependencies. Run it after
# changing the harness, before spending a real sweep.
#
#   python -m jumper_ablations.cli.run suite=harness_selftest \
#       protocol.generations_per_target=1 protocol.benchmark.runs=2
id: harness_selftest
description: One synthetic payload, one preset - a wiring check.
usecases:
  - harness/selftest
ablations:
  - base
