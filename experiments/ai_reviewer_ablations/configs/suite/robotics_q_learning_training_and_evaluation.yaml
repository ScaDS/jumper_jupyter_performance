# One robotics payload against the four presets of the cell_77 pilot.
#
#   sbatch --array=0-3 scripts/romeo.sbatch suite=robotics_q_learning_training_and_evaluation protocol=pilot
#
# A pure-CPU tabular Q-learning payload; submit with scripts/romeo.sbatch.
#
# A suite per payload rather than one for the family, so that each gets its
# own run, its own allocation and its own cost; robotics.yaml keeps the full
# nine-preset grid for the main run.
id: robotics_q_learning_training_and_evaluation
description: robotics/q_learning_training_and_evaluation against the four most informative presets.
usecases:
  - robotics/q_learning_training_and_evaluation
ablations:
  - base
  - code_only
  - no_timing
  - no_perf
