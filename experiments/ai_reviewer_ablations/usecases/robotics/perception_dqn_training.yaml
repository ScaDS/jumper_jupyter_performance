description: >-
  5 CarRacing episodes of up to 1000 steps, where each step encodes a 96x96
  frame into 11 hand-made features with a pure-Python ray cast, stores the raw
  frames in a memory-mapped replay buffer and takes one gradient step on a tiny
  MLP.

preconditions:
  - gymnasium[box2d] provides CarRacing-v3
  - A CUDA device is available, or the agent falls back to CPU
  - Enough disk for the LazyMemmapStorage backing file

benchmark:
  # CUDA contexts do not survive fork, and the memmap storage is per-process.
  replay_mode: full
  extra_replay_modes: []

reference_facts:
  - id: python_ray_cast
    source: code
    weight: 2
    fact: >-
      Perception is a pure-Python ray cast: eight rays, each marching pixel by
      pixel down the frame in a Python loop and testing every pixel with
      _is_car and _is_grass. This is the dominant cost of a step, and it is
      interpreted scalar work over an image.
  - id: cvtcolor_per_pixel
    source: code
    weight: 2
    fact: >-
      _is_grass calls cv2.cvtColor on a single reshaped 1x1 pixel, so an
      OpenCV conversion is invoked once per pixel visited by a ray instead of
      once per frame.
  - id: features_recomputed_three_times
    source: code
    weight: 2
    fact: >-
      Each step encodes features three times: once in act for the current
      state, and twice in store_experience for the same state and for the next
      state. The next state is then encoded again as the current state on the
      following step.
  - id: raw_frames_in_replay_buffer
    source: code
    weight: 1
    fact: >-
      Both pixels and next_pixels are stored as float32 images in the replay
      buffer even though only the 11 encoded features are ever sampled from it,
      so each transition writes roughly 200 kB to the memmap for data that is
      never read back.
  - id: tiny_network_per_step
    source: code
    weight: 1
    fact: >-
      The Q network is LayerNorm plus two linear layers over an 11-dimensional
      state, updated once per environment step on batches of 128, so the GPU
      work per step is far smaller than the launch and transfer around it.
  - id: per_step_host_sync
    source: code
    weight: 1
    fact: >-
      act ends in .item() on the argmax and store_experience moves features
      back with .cpu(), so every step round-trips between device and host.

  # Transcribed from a measured `base` record (run robotics_facts_dqn, one
  # capella GPU: a quarter of a node, 16 cores and one H100, at five
  # episodes). Written as thresholds rather than as the numbers that were
  # observed, so that another allocation does not falsify them: utilisation
  # figures are shares of what the job had.
  #
  # Each states only what its own source shows; the reason behind a number
  # belongs to a `code` fact above, so that a preset without telemetry gets no
  # credit for it.
  - id: duration
    source: timing
    weight: 1
    tolerance: 0.5
    fact: >-
      The cell runs for over a minute (about 77 s measured).
  - id: gpu_allocated_unused
    source: tags
    weight: 2
    fact: >-
      The collector tags the cell gpu-allocated-but-not-used: a GPU is held
      for the whole cell and does no measurable work.
  - id: gpu_idle
    source: perf
    weight: 2
    fact: >-
      GPU utilisation stays around 1% for the whole cell, with under one
      gigabyte of GPU memory in use.
  - id: cpu_busy
    source: perf
    weight: 2
    fact: >-
      CPU utilisation averages about two thirds of the allocation and peaks
      near three quarters, so the host, not the device, does the work.
  - id: memory_growth
    source: perf
    weight: 1
    fact: >-
      Resident memory climbs steadily for the whole cell (from about 1.4 to
      about 2 GB) instead of levelling off.

# There is deliberately no disk-write fact here, although the code writes
# every transition to a memory-mapped buffer: the measured run shows no
# write traffic, since those pages stay in the page cache, and a fact the
# telemetry cannot show would credit presets for what nobody measured.
