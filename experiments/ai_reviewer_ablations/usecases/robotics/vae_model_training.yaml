description: >-
  50 epochs of a small convolutional VAE over MNIST, batch 128, fed by a
  single-process DataLoader and synchronised on the host once per batch.

preconditions:
  - A CUDA device is available, or the payload silently falls back to CPU
  - >-
    The MNIST download lives at ${workspace}/data/MNIST; fetch it once into
    the shared family directory, since compute nodes may not reach the mirror

# A benchmark replay executes the prefix in a fresh temporary directory, so
# root='./data' would download MNIST again for every measurement - or fail
# where the node has no route out. The notebook reads the root from
# MNIST_ROOT and falls back to ./data when it is unset, so it still runs by
# hand. Each pass gets its own directory, seeded with a link to the one
# download: concurrent passes then never race on extracting it.
workspace:
  mode: per_pass
  seed:
    data:
      - MNIST

environment:
  MNIST_ROOT: ${workspace}/data

benchmark:
  # CUDA contexts do not survive fork; keep this usecase on the full replay.
  replay_mode: full
  extra_replay_modes: []

reference_facts:
  - id: single_process_dataloader
    source: code
    weight: 2
    fact: >-
      The DataLoader is built with default num_workers=0, so image decoding,
      ToTensor conversion and collation for every one of the roughly 23000
      batches run in the training process, between the steps they feed.
  - id: per_batch_sync
    source: code
    weight: 2
    fact: >-
      total_loss += loss.item() runs once per batch and blocks the host until
      the device has finished, so the loop synchronises once per iteration for
      a number it only prints at the end of the epoch.
  - id: small_model_large_overhead
    source: code
    weight: 1
    fact: >-
      The network is two small convolutions, two linear layers and a
      two-dimensional latent, applied to 1x28x28 inputs at batch 128, so each
      step is a short burst of GPU work surrounded by host-side overhead.
  - id: unpinned_transfer
    source: code
    weight: 1
    fact: >-
      data.to(device) is a blocking copy: the loader does not pin memory and
      the call does not pass non_blocking, so the transfer cannot overlap with
      compute.
  - id: loss_module_per_batch
    source: code
    weight: 1
    fact: >-
      vae_loss constructs a new nn.BCELoss module on every call, once per
      batch, instead of reusing one.
  - id: dataset_fits_in_memory
    source: code
    weight: 1
    fact: >-
      MNIST is 60000 28x28 images, small enough to hold on the device for the
      whole run, so the per-batch host work is avoidable rather than inherent.

  # Transcribed from a measured `base` record (run robotics_facts, one capella
  # GPU: a quarter of a node, 16 cores and one H100). Written as thresholds
  # rather than as the numbers that were observed, so that another allocation
  # does not falsify them: utilisation figures are shares of what the job had.
  #
  # Each states only what its own source shows; the reason behind a number
  # belongs to a `code` fact above, so that a preset without telemetry gets no
  # credit for it.
  - id: duration
    source: timing
    weight: 1
    tolerance: 0.5
    fact: >-
      The cell runs for roughly three minutes (about 170 s measured), long
      enough that its cost is worth reducing.
  - id: gpu_underuse
    source: perf
    weight: 2
    fact: >-
      GPU utilisation stays below about 10% for the whole cell and GPU memory
      under one gigabyte, so the device is idle almost all of the time.
  - id: one_core_busy
    source: perf
    weight: 1
    fact: >-
      CPU utilisation stays near one core's worth of the allocation (about 7%
      of sixteen cores), so neither the host nor the device is saturated.

# There is deliberately no `tags`-sourced fact here. The measured run tagged
# this payload `normal`, which is the collector saying it found nothing
# remarkable - inventing a tag fact to give `no_tags` something to lose would
# make the coverage difference an artefact of this file rather than a
# measurement.
