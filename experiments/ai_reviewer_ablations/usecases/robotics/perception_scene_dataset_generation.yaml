description: >-
  Two 180-frame MuJoCo scenes rendered offscreen at 640x480, held in memory as
  Python lists and written out as video, ground truth and a background image.

preconditions:
  - MuJoCo can create an offscreen context (MUJOCO_GL=egl is set by the prefix)
  - object_detection_data/ is writable
  - OpenCV has a working mp4v or MJPG video writer

# The payload writes its videos, ground truth and background images into
# object_detection_data/ under the working directory, so concurrent passes
# sharing the family directory would write over one another. Nothing is
# read, so nothing is seeded.
workspace:
  mode: per_pass

benchmark:
  replay_mode: full
  # The renderer holds an EGL context; do not fork it into a child.
  extra_replay_modes: []

reference_facts:
  - id: sequential_frame_rendering
    source: code
    weight: 2
    fact: >-
      The work is 360 sequential offscreen renders - two scenes of 180 frames
      at 640x480 - each preceded by a cheap mj_forward. Rendering, not physics,
      is what the loop spends its time on.
  - id: all_frames_held_in_memory
    source: code
    weight: 2
    fact: >-
      Every rendered frame is appended to a Python list and kept: 360 frames of
      640x480x3 uint8 is roughly 330 MB, retained in scene_data after the loop
      and handed again to media.show_video.
  - id: renderer_rebuilt_for_background
    source: code
    weight: 1
    fact: >-
      render_background_frame builds a fresh MjModel, MjData and Renderer for a
      single frame, once per scene, although the scene model already exists in
      the caller.
  - id: per_frame_colour_conversion
    source: code
    weight: 1
    fact: >-
      save_video_cv2 walks the frame list a second time, converting each frame
      from RGB to BGR before writing it, so every frame is traversed twice.
  - id: independent_scenes
    source: code
    weight: 1
    fact: >-
      The two scene configurations share no state and are generated one after
      the other.

  # Transcribed from a measured `base` record (run robotics_facts, one capella
  # GPU: a quarter of a node, 16 cores and one H100). Written as thresholds
  # rather than as the numbers that were observed, so that another allocation
  # does not falsify them: utilisation figures are shares of what the job had.
  #
  # Each states only what its own source shows; the reason behind a number
  # belongs to a `code` fact above, so that a preset without telemetry gets no
  # credit for it.
  - id: duration
    source: timing
    weight: 1
    tolerance: 0.5
    fact: >-
      The cell runs for only a few seconds (about 3 s measured).
  - id: gpu_idle
    source: perf
    weight: 2
    fact: >-
      No GPU utilisation or GPU memory is measured during the cell, although a
      GPU is allocated.
  - id: cpu_underused
    source: perf
    weight: 1
    fact: >-
      CPU utilisation peaks at roughly a tenth of the allocation, so most of
      the cores are idle.
  - id: memory_growth
    source: perf
    weight: 2
    fact: >-
      Resident memory climbs throughout the cell, by close to a factor of two
      (from about 0.4 to about 0.7 GB), rather than levelling off.

# There is deliberately no `tags`-sourced fact here. The measured run tagged
# this payload `normal`, which is the collector saying it found nothing
# remarkable - inventing a tag fact to give `no_tags` something to lose would
# make the coverage difference an artefact of this file rather than a
# measurement.
