description: >-
  20000 training episodes plus 10000 greedy evaluation episodes of tabular
  Q-learning on a 4x4 grid world, in nested pure-Python loops.

preconditions:
  - No GPU is needed; pygame and gymnasium are importable

benchmark:
  replay_mode: full
  # The prefix is imports and a 200-iteration dynamic-programming solve, so a
  # fast replay mode would save little and this payload is CPU-only anyway.
  extra_replay_modes: []

reference_facts:
  - id: nested_python_loops
    source: code
    weight: 2
    fact: >-
      The dominant structure is two nested Python loops - 30000 episodes of up
      to 100 steps each - around work that is a handful of scalar operations,
      so interpreter dispatch dominates the arithmetic.
  - id: numpy_on_scalars
    source: code
    weight: 2
    fact: >-
      Every step calls numpy on tiny data: np.random.choice(np.arange(4)) for
      exploration, np.where(...) over four entries for the greedy choice, and
      tuple() indexing of a 4x4x4 array. Each call costs far more than the
      value it produces.
  - id: unused_info_per_step
    source: code
    weight: 2
    fact: >-
      GridWorldEnv.step calls _get_info, which computes an L1 norm with
      np.linalg.norm on every step; the training and evaluation loops discard
      that info entirely.
  - id: full_array_error_per_episode
    source: code
    weight: 1
    fact: >-
      Each episode computes np.abs(Q_star - Q_pi_hat) twice, once for the max
      and once for the mean, allocating the difference and its absolute value
      two times per episode over 20000 episodes.
  - id: duplicated_evaluation_loop
    source: code
    weight: 1
    fact: >-
      The evaluation loop repeats the training loop body with epsilon fixed at
      zero, so the same per-step overhead is paid again for 10000 more
      episodes.
  - id: single_threaded_cpu
    source: code
    weight: 1
    fact: >-
      Nothing in the payload is vectorised, threaded or offloaded; episodes are
      independent of one another but are walked strictly in sequence.

  # Transcribed from a measured `base` record (run robotics_facts_q_learning,
  # one romeo node; the collector sees all 128 cores although the job holds
  # 64). Written as thresholds rather than as the numbers that were observed,
  # so that another allocation does not falsify them: utilisation figures are
  # shares of what the collector saw.
  #
  # Each states only what its own source shows; the reason behind a number
  # belongs to a `code` fact above, so that a preset without telemetry gets no
  # credit for it.
  - id: duration
    source: timing
    weight: 1
    tolerance: 0.5
    fact: >-
      The cell runs for several seconds (about 7 s measured).
  - id: one_core_busy
    source: perf
    weight: 2
    fact: >-
      CPU utilisation stays around 1% of the node - one core's worth of over a
      hundred - for the whole cell, so almost the entire machine is idle.
  - id: flat_small_memory
    source: perf
    weight: 1
    fact: >-
      Resident memory stays flat at about a quarter of a gigabyte, so memory
      plays no part in the cost.

# There is deliberately no `tags`-sourced fact here. The measured run tagged
# this payload `normal`, which is the collector saying it found nothing
# remarkable - inventing a tag fact to give `no_tags` something to lose would
# make the coverage difference an artefact of this file rather than a
# measurement.
