id: minian/cell_77
title: update_temporal deconvolution over a parameter grid
payload_type: dask_parameter_sweep
description: >-
  A sequential loop over a four-point sparse-penalty grid. Each iteration runs
  update_temporal on persisted dask arrays and then forces six separate
  .compute() calls, five of which recompute values the iteration already has.

# This usecase reads the intermediate zarr store the full minian pipeline
# writes, and does not produce it. Run minian/cell_40 (or the upstream
# pipeline) once first, then point the store at a stable location.
preconditions:
  - >-
    The minian intermediate store holds A, C_chk, b, f and Y_fm_chk, and lives
    at ${workspace}/minian_intermediate (roughly 4 GB)

# A benchmark replay executes the prefix in a fresh temporary directory, so a
# path the notebook resolves against the working directory would not exist
# when the cell is measured. Pinning it here is what makes this usecase
# benchmarkable at all; the notebook falls back to ./minian_intermediate when
# the variable is unset, so it still runs by hand.
environment:
  MINIAN_INTERMEDIATE: ${workspace}/minian_intermediate

benchmark:
  # The prefix is three cells - imports, open_minian, two persists - so the
  # full replay is affordable here in a way it is not for cell_40, whose
  # prefix is the entire pipeline.
  replay_mode: full
  extra_replay_modes: []

reference_facts:
  - id: sequential_grid
    source: code
    weight: 2
    fact: >-
      The parameter grid is walked sequentially by itertools.product; the four
      sparse-penalty settings are independent and could be evaluated together.
  - id: redundant_computes
    source: code
    weight: 2
    fact: >-
      Six .compute() calls per iteration force the same dask graph repeatedly;
      YrA and A_sub in particular are recomputed every iteration although
      neither depends on the loop variables.
  - id: persisted_inputs
    source: code
    weight: 1
    fact: >-
      A_sub, C_sub and YrA are already persisted, so the cost is in forcing
      results rather than in reading the store.

# As in minian/cell_40: telemetry-derived facts must be transcribed from a
# measured `base` record before they are used, never guessed.
