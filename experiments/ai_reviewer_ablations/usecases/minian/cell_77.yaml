id: minian/cell_77
title: update_temporal deconvolution over a parameter grid
payload_type: dask_parameter_sweep
description: >-
  A sequential loop over a four-point sparse-penalty grid. Each iteration runs
  update_temporal on persisted dask arrays and then forces six separate
  .compute() calls, five of which recompute values the iteration already has.

# This usecase reads the intermediate zarr store the full minian pipeline
# writes, and does not produce it. Run minian/cell_40 (or the upstream
# pipeline) once first, then point the store at a stable location.
preconditions:
  - >-
    The minian intermediate store holds A, C_chk, b, f and Y_fm_chk, and lives
    at ${workspace}/minian_intermediate (roughly 4 GB)

# A benchmark replay executes the prefix in a fresh temporary directory, so a
# path the notebook resolves against the working directory would not exist
# when the cell is measured. Pinning it here is what makes this usecase
# benchmarkable at all; the notebook falls back to ./minian_intermediate when
# the variable is unset, so it still runs by hand.
# update_temporal saves its intermediates back into the store it read from,
# so two passes sharing a working directory collide on a zarr group one of
# them has not finished replacing. Each pass therefore gets its own
# directory, seeded with links to the shared store: reads resolve to the one
# copy on disk, writes land beside the links.
workspace:
  mode: per_pass
  # Only what the payload reads. update_temporal saves with overwrite=True,
  # which removes the old entry before writing - and a symbolic link cannot
  # be removed that way, so everything it writes must be absent here rather
  # than linked.
  seed:
    minian_intermediate:
      - A.zarr
      - C_chk.zarr
      - b.zarr
      - f.zarr
      - Y_fm_chk.zarr

environment:
  MINIAN_INTERMEDIATE: ${workspace}/minian_intermediate

benchmark:
  # The prefix is three cells - imports, open_minian, two persists - so the
  # full replay is affordable here in a way it is not for cell_40, whose
  # prefix is the entire pipeline.
  replay_mode: full
  extra_replay_modes: []

reference_facts:
  - id: sequential_grid
    source: code
    weight: 2
    fact: >-
      The parameter grid is walked sequentially by itertools.product; the four
      sparse-penalty settings are independent and could be evaluated together.
  - id: redundant_computes
    source: code
    weight: 2
    fact: >-
      Six .compute() calls per iteration force the same dask graph repeatedly;
      YrA and A_sub in particular are recomputed every iteration although
      neither depends on the loop variables.
  - id: persisted_inputs
    source: code
    weight: 1
    fact: >-
      A_sub, C_sub and YrA are already persisted, so the cost is in forcing
      results rather than in reading the store.

  # Transcribed from a measured `base` record (run cell77_facts, one romeo
  # node, 16 cores). Written as thresholds rather than as the numbers that
  # were observed, so that another allocation does not falsify them: the
  # utilisation figures are shares of whatever node the run had.
  #
  # Each states only what its own source shows. "The machine is idle" belongs
  # to `perf`; "the loop is sequential" belongs to `code`, and writing the
  # second into a perf fact would hand every code-only preset credit for
  # telemetry it never saw - which is precisely the difference conditional
  # and global coverage exist to measure.
  - id: duration
    source: timing
    weight: 1
    tolerance: 0.5
    fact: >-
      The cell runs for roughly a minute and a half (about 72 s measured),
      so it is long enough to measure and too long to ignore.
  - id: cpu_underused
    source: perf
    weight: 2
    fact: >-
      CPU utilisation averages a few percent of the node and peaks at roughly
      a quarter of it, so most of the machine is idle for most of the cell.
  - id: small_resident_set
    source: perf
    weight: 1
    fact: >-
      Peak resident memory stays under about one gigabyte, far below what the
      node offers.

# There is deliberately no `tags`-sourced fact here. The measured run tagged
# this payload `normal`, which is the collector saying it found nothing
# remarkable - inventing a tag fact to give `no_tags` something to lose would
# make the coverage difference an artefact of this file rather than a
# measurement.
